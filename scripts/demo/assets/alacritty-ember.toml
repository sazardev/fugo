# Standalone Alacritty config for the demo recording — deliberately NOT
# importing the machine's own ~/.config/alacritty/alacritty.toml (different
# theme/keybindings/font), so the recorded terminal reads as the same
# product as site/styles.css: the ember/flame palette, flat/borderless
# chrome, no incidental personal config leaking into the video.
#
# Color values are lifted directly from site/styles.css's :root tokens
# (dark variant) — see site/DESIGN.md for what each one means. Only yellow/
# magenta/black/white pull from the brand palette; red/green/blue/cyan stay
# close to conventional ANSI so tool output (go build errors, `fugo doctor`
# checks, etc.) stays legible.

[window]
decorations = "none" # site's own rule: "every visual boundary is a
# background-color step, never a border" — no title bar/frame to contradict that.
opacity = 1.0
dynamic_padding = true
padding = { x = 16, y = 16 }
# Sized so the window is already roughly the left-half tile record-demo.sh
# moves it to (x11_layout_split resizes it precisely later; this just
# avoids a tiny default-size window for the first several beats before
# that split happens).
dimensions = { columns = 150, lines = 55 }

[font]
size = 13.0

[font.normal]
family = "IosevkaTerm Nerd Font Mono"
style = "Regular"

[font.bold]
family = "IosevkaTerm Nerd Font Mono"
style = "Bold"

[colors.primary]
background = "#121110" # site --bg (dark)
foreground = "#ece6d9" # site --ink (dark)

[colors.cursor]
text = "#121110"
cursor = "#ff6a1a" # site --flame-core

[colors.selection]
text = "#121110"
background = "#ff6a1a"

[colors.normal]
black = "#231e16" # site --bg-strong (dark)
red = "#dc2626"
green = "#4ade80"
yellow = "#ffb238" # site --flame-bright
blue = "#93c5fd"
magenta = "#c7350c" # site --ember-deep
cyan = "#67e8f9"
white = "#ece6d9" # site --ink (dark)

[colors.bright]
black = "#39321f" # site --line-strong (dark)
red = "#f87171"
green = "#86efac"
yellow = "#ffdd6b" # site --flame-gold
blue = "#bfdbfe"
magenta = "#ff6a1a" # site --flame-core
cyan = "#a5f3fc"
white = "#ffffff"
