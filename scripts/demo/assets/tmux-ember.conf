# tmux config for the demo recording — tmux ships a bright green default
# status line, which clashes with the ember/flame palette everywhere else
# in the video (assets/alacritty-ember.toml, the app's own branded theme).
# Same site/styles.css dark tokens as those two (see site/DESIGN.md).

set -g status-style "bg=#231e16,fg=#ece6d9"        # --bg-strong / --ink
set -g window-status-current-style "bg=#ff6a1a,fg=#1a1006,bold" # --flame-core
set -g pane-border-style "fg=#292319"               # --line
set -g pane-active-border-style "fg=#ff6a1a"        # --flame-core
set -g status-left ""
set -g status-right "#[fg=#8c8271]%H:%M %d-%b-%y"   # --ink-dim
set -g status-justify left
set -g status-interval 1
